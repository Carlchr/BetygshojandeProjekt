{% extends "base.html" %}
{% block customtitle %}Login Page{% endblock %}

{% block content %}
    <h2>Välkommen till Elias Och Jeff Hemsida!</h2>
    <p>Detta är inloggningssidan för vårt forum där du kan delta i diskussioner och interagera med andra användare.</p>

    <form method="post">
        <label for="username">Användarnamn:</label>
        <input type="text" id="username" name="username" required><br><br>

        <label for="password">Lösenord:</label>
        <input type="password" id="password" name="password" required><br><br>

        <input type="submit" value="Logga in">

{% endblock %}
